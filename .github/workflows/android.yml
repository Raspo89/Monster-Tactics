name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          export APP_VERSION_NAME=$(node -p "require('../package.json').version")
          export APP_VERSION_CODE=${{ github.run_number }}
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../MonsterTactics.apk
          echo "VERSION=$APP_VERSION_NAME" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: MonsterTactics-apk
          path: MonsterTactics.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VERSION }}-b${{ github.run_number }}
          name: وحوش المعركة ${{ env.VERSION }} (Android)
          body: |
            نسخة أندرويد للجوال وأجهزة TV box. نزّل MonsterTactics.apk وثبّته (اسمح بالتثبيت من مصادر غير معروفة).
            كل نسخة جديدة تنثبت فوق القديمة وتحافظ على تقدمك.
          files: MonsterTactics.apk
          make_latest: true
